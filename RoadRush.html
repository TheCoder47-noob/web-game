<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Road Rush</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0d1117;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#c6d0e0;
    gap:14px;
    padding:16px;
    user-select:none;
  }
  h1{
    font-size:1.6rem;font-weight:900;letter-spacing:0.18em;
    background:linear-gradient(135deg,#6c8cff,#9f7bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #game{
    display:block;border-radius:14px;
    border:2px solid #1c2230;
    box-shadow:0 24px 70px rgba(0,0,0,0.7);
    cursor:pointer;
  }
  .controls{
    display:grid;
    grid-template-areas:"  up  " "left down right";
    grid-template-columns:repeat(3,52px);
    grid-template-rows:repeat(2,52px);
    gap:6px;
  }
  .btn{
    background:#11141b;border:1px solid #252b3a;border-radius:10px;
    color:#7a8aaa;font-size:1.3rem;cursor:pointer;
    display:grid;place-items:center;
    transition:background .1s,color .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active,.btn.on{background:#252b3a;color:#fff;border-color:#3a4257}
  #btnUp{grid-area:up}
  #btnLeft{grid-area:left}
  #btnDown{grid-area:down}
  #btnRight{grid-area:right}
  .hint{font-size:0.75rem;color:#3a4257;letter-spacing:0.04em}
</style>
</head>
<body>

<h1>ROAD RUSH</h1>
<canvas id="game" width="420" height="640"></canvas>

<div class="controls">
  <div class="btn" id="btnUp">▲</div>
  <div class="btn" id="btnLeft">◀</div>
  <div class="btn" id="btnDown">▼</div>
  <div class="btn" id="btnRight">▶</div>
</div>
<div class="hint">W / ↑ Accelerate &nbsp;·&nbsp; S / ↓ Brake &nbsp;·&nbsp; A D / ← → Steer</div>

<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = canvas.width;   // 420
const H = canvas.height;  // 640

// ── Road geometry ──────────────────────────────────────
const ROAD_W   = 240;
const ROAD_X   = (W - ROAD_W) / 2;   // 90
const LANE_W   = ROAD_W / 2;          // 120
const MIN_PX   = ROAD_X + 24;
const MAX_PX   = ROAD_X + ROAD_W - 24;

// ── Colors ─────────────────────────────────────────────
const COL = {
  grass1:'#080f08', grass2:'#0a150a',
  road:'#101418',   shoulder:'#151b22',
  yellow:'#e8b800', white:'rgba(255,255,255,0.75)',
  accent:'#6c8cff', green:'#22d3a4',  red:'#ff4a4a',
  hud:'rgba(8,11,16,0.78)',
};
const NPC_COLS = ['#e05050','#d04040','#c070e0','#50a050','#e09030','#4090e0','#e0d040','#9060d0'];

// ── Utilities ──────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function shade(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.max(0,r+amt));g=Math.min(255,Math.max(0,g+amt));b=Math.min(255,Math.max(0,b+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lerp(a,b,t){return a+(b-a)*t}

// ── State ──────────────────────────────────────────────
let state, score, hiScore=0, frame, roadOff, grassOff;
let trees, npcs, particles;

const player = {
  x:W/2, y:H-130, w:42, h:70,
  vx:0, speed:0, color:'#4a9eff',
  maxSpeed:11, accel:0.15, brakeStr:0.3,
  latMax:5.5, latAccel:0.45, latFric:0.72,
  braking:false,
};

// ── Input ──────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',  e=>{keys[e.key]=false;});

const BTN_MAP={btnUp:['ArrowUp','w','W'],btnDown:['ArrowDown','s','S'],btnLeft:['ArrowLeft','a','A'],btnRight:['ArrowRight','d','D']};
Object.entries(BTN_MAP).forEach(([id,ks])=>{
  const el=document.getElementById(id);
  const on =()=>{ks.forEach(k=>keys[k]=true); el.classList.add('on')};
  const off=()=>{ks.forEach(k=>keys[k]=false);el.classList.remove('on')};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
});

canvas.addEventListener('click',()=>{if(state!=='play')init();});

// ── Init ───────────────────────────────────────────────
function init(){
  state='play'; score=0; frame=0; roadOff=0; grassOff=0;
  player.x=W/2; player.vx=0; player.speed=3;
  trees=[]; npcs=[]; particles=[];
  // pre-fill trees
  for(let y=H+60;y>-100;y-=90) spawnTree(y);
}

// ── Spawning ───────────────────────────────────────────
function spawnTree(atY){
  const y = atY ?? -70;
  // left side
  trees.push({
    x: ROAD_X - 18 - Math.random()*52,
    y, size:26+Math.random()*26,
  });
  // right side
  trees.push({
    x: ROAD_X+ROAD_W+18+Math.random()*52,
    y, size:26+Math.random()*26,
  });
}

function spawnNPC(){
  const lane  = Math.random()<0.5 ? 0 : 1;
  const laneX = ROAD_X + lane*LANE_W + LANE_W/2;
  // don't stack on top of each other
  if(npcs.some(n=>n.y<60 && Math.abs(n.x-laneX)<10)) return;
  npcs.push({
    x:laneX, y:-80, w:40, h:68,
    speed:1.2+Math.random()*2.2,
    color:NPC_COLS[Math.floor(Math.random()*NPC_COLS.length)],
  });
}

// ── Draw: Background / grass ───────────────────────────
function drawBg(){
  const stripeH=80;
  const offset = grassOff % (stripeH*2);
  for(let y=-stripeH*2+offset;y<H+stripeH;y+=stripeH*2){
    ctx.fillStyle=COL.grass1; ctx.fillRect(0,y,W,stripeH*2);
    ctx.fillStyle=COL.grass2; ctx.fillRect(0,y+stripeH,W,stripeH);
  }
}

// ── Draw: Road ─────────────────────────────────────────
function drawRoad(){
  // road base
  ctx.fillStyle=COL.road;
  ctx.fillRect(ROAD_X,0,ROAD_W,H);

  // shoulders
  ctx.fillStyle=COL.shoulder;
  ctx.fillRect(ROAD_X,0,7,H);
  ctx.fillRect(ROAD_X+ROAD_W-7,0,7,H);

  // edge lines (solid yellow)
  ctx.strokeStyle=COL.yellow; ctx.lineWidth=3.5; ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ROAD_X+5,0);ctx.lineTo(ROAD_X+5,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ROAD_X+ROAD_W-5,0);ctx.lineTo(ROAD_X+ROAD_W-5,H);ctx.stroke();

  // center dashed white
  ctx.strokeStyle=COL.white; ctx.lineWidth=2.5;
  ctx.setLineDash([38,26]); ctx.lineDashOffset=-roadOff;
  ctx.beginPath();ctx.moveTo(ROAD_X+LANE_W,0);ctx.lineTo(ROAD_X+LANE_W,H);ctx.stroke();
  ctx.setLineDash([]);
}

// ── Draw: Tree ─────────────────────────────────────────
function drawTree(t){
  const {x,y,size:s}=t;
  // shadow
  ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(x+s*.12,y+4,s*.42,s*.14,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // trunk
  ctx.fillStyle='#3a2010';
  ctx.fillRect(x-s*.13,y-s*.1,s*.26,s*.2);
  // foliage layers (dark → lighter toward top)
  ctx.fillStyle='#0d2e10';
  ctx.beginPath();ctx.arc(x,y-s*.22,s*.52,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#134a1a';
  ctx.beginPath();ctx.arc(x,y-s*.52,s*.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a6022';
  ctx.beginPath();ctx.arc(x,y-s*.74,s*.26,0,Math.PI*2);ctx.fill();
  // highlight
  ctx.fillStyle='rgba(60,180,70,.13)';
  ctx.beginPath();ctx.arc(x-s*.1,y-s*.65,s*.13,0,Math.PI*2);ctx.fill();
}

// ── Draw: Car ──────────────────────────────────────────
function drawCar(x,y,w,h,color,isPlayer,braking){
  ctx.save();ctx.translate(x,y);

  // drop shadow
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(2,h*.38,w*.42,h*.1,0,0,Math.PI*2);ctx.fill();

  // body
  ctx.fillStyle=color;
  rr(-w/2,-h/2,w,h,8);ctx.fill();

  // body top-edge shine
  ctx.fillStyle='rgba(255,255,255,.11)';
  rr(-w/2,-h/2,w,h*.22,8);ctx.fill();

  // windshield (front = top for player going up, bottom for NPC coming down)
  const wsFront = isPlayer ? -h/2+9 : h/2-9-h*.25;
  ctx.fillStyle='rgba(150,215,255,.58)';
  rr(-w/2+5, wsFront, w-10, h*.26, 5);ctx.fill();
  // glare
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.fillRect(-w/2+7, wsFront+3, (w-14)*.38, 4);

  // roof
  ctx.fillStyle=shade(color,-38);
  rr(-w/2+5,isPlayer?-h/2+h*.3:-h/2+h*.44,w-10,h*.28,4);ctx.fill();

  // rear window
  const wsRear = isPlayer ? h/2-9-h*.2 : -h/2+9;
  ctx.fillStyle='rgba(150,215,255,.32)';
  rr(-w/2+5, wsRear, w-10, h*.19, 4);ctx.fill();

  // wheels
  const ww=9,wh=16,wr=3;
  ctx.fillStyle='#080a0c';
  [[-w/2-2,-h/2+10],[w/2-ww+2,-h/2+10],[-w/2-2,h/2-wh-10],[w/2-ww+2,h/2-wh-10]].forEach(([wx,wy])=>{
    rr(wx,wy,ww,wh,wr);ctx.fill();
    ctx.fillStyle='#222';ctx.fillRect(wx+2,wy+4,ww-4,wh-8);ctx.fillStyle='#080a0c';
  });

  if(isPlayer){
    // headlights (top)
    ctx.fillStyle='#ffffcc';
    ctx.beginPath();ctx.arc(-w/2+7,-h/2+5,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,-h/2+5,4,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#ffffaa';
    ctx.beginPath();ctx.arc(-w/2+7,-h/2+5,11,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,-h/2+5,11,0,Math.PI*2);ctx.fill();ctx.restore();
    // taillights
    const tlAlpha = braking ? 1 : 0.55;
    ctx.fillStyle=`rgba(255,50,30,${tlAlpha})`;
    ctx.beginPath();ctx.arc(-w/2+7,h/2-5,4.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,h/2-5,4.5,0,Math.PI*2);ctx.fill();
    if(braking){
      ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#ff3322';
      ctx.beginPath();ctx.arc(-w/2+7,h/2-5,13,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc( w/2-7,h/2-5,13,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  } else {
    // NPC headlights (face toward player = bottom of sprite)
    ctx.fillStyle='#ffeebb';
    ctx.beginPath();ctx.arc(-w/2+7,h/2-5,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,h/2-5,3.5,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#ffee99';
    ctx.beginPath();ctx.arc(-w/2+7,h/2-5,9,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,h/2-5,9,0,Math.PI*2);ctx.fill();ctx.restore();
    // NPC taillights (top)
    ctx.fillStyle='rgba(255,40,20,.6)';
    ctx.beginPath();ctx.arc(-w/2+7,-h/2+5,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( w/2-7,-h/2+5,3,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

// ── Draw: Particles ────────────────────────────────────
function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ── Draw: HUD ──────────────────────────────────────────
function drawHUD(){
  // score box
  ctx.fillStyle=COL.hud; rr(10,10,148,58,10);ctx.fill();
  ctx.fillStyle=COL.accent;ctx.font='bold 10px Segoe UI';ctx.fillText('SCORE',22,27);
  ctx.fillStyle='#fff';ctx.font='bold 24px Segoe UI';ctx.fillText(Math.floor(score),22,52);

  // speed box
  ctx.fillStyle=COL.hud; rr(W-118,10,108,58,10);ctx.fill();
  ctx.fillStyle=COL.green;ctx.font='bold 10px Segoe UI';ctx.fillText('SPEED',W-106,27);
  const spd=(player.speed-2)/9;
  ctx.fillStyle='#1a1f2a'; rr(W-106,32,88,10,5);ctx.fill();
  const barColor=spd>.75?COL.red:spd>.45?'#ffcc00':COL.green;
  ctx.fillStyle=barColor; rr(W-106,32,88*Math.max(0,spd),10,5);ctx.fill();
  ctx.fillStyle='#8090a8';ctx.font='10px Segoe UI';
  ctx.fillText(Math.round(player.speed*14)+' km/h',W-106,56);
}

// ── Draw: Overlay screens ──────────────────────────────
function drawOverlay(){
  ctx.textAlign='center';
  ctx.fillStyle='rgba(8,11,16,.88)';ctx.fillRect(0,0,W,H);

  if(state==='start'){
    ctx.fillStyle=COL.accent;ctx.font='bold 52px Segoe UI';ctx.fillText('ROAD RUSH',W/2,H/2-100);
    ctx.fillStyle='#6070a0';ctx.font='15px Segoe UI';ctx.fillText('Dodge traffic. Survive as long as you can.',W/2,H/2-62);

    ctx.fillStyle='rgba(255,255,255,.05)'; rr(W/2-130,H/2-44,260,110,12);ctx.fill();
    ctx.fillStyle='#8090b0';ctx.font='bold 13px Segoe UI';ctx.fillText('HOW TO PLAY',W/2,H/2-22);
    ctx.font='12px Segoe UI';
    ctx.fillText('↑ W  —  Accelerate',W/2,H/2+2);
    ctx.fillText('↓ S  —  Brake',W/2,H/2+22);
    ctx.fillText('← A  /  → D  —  Steer',W/2,H/2+42);
    ctx.fillText('Avoid the other cars!',W/2,H/2+62);

    ctx.fillStyle=COL.accent; rr(W/2-85,H/2+82,170,50,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 19px Segoe UI';ctx.fillText('TAP TO START',W/2,H/2+114);
  }

  if(state==='dead'){
    ctx.fillStyle=COL.red;ctx.font='bold 46px Segoe UI';ctx.fillText('GAME OVER',W/2,H/2-100);
    ctx.fillStyle='#6070a0';ctx.font='14px Segoe UI';ctx.fillText('You were hit!',W/2,H/2-68);

    ctx.fillStyle='rgba(255,255,255,.06)'; rr(W/2-110,H/2-52,220,92,12);ctx.fill();
    ctx.fillStyle=COL.accent;ctx.font='bold 11px Segoe UI';ctx.fillText('YOUR SCORE',W/2,H/2-28);
    ctx.fillStyle='#fff';ctx.font='bold 36px Segoe UI';ctx.fillText(Math.floor(score),W/2,H/2+10);

    if(Math.floor(score)>=Math.floor(hiScore)&&hiScore>0){
      ctx.fillStyle='#ffcc00';ctx.font='bold 12px Segoe UI';ctx.fillText('🏆 NEW HIGH SCORE!',W/2,H/2+34);
    } else if(hiScore>0){
      ctx.fillStyle='#4a5570';ctx.font='12px Segoe UI';ctx.fillText('Best: '+Math.floor(hiScore),W/2,H/2+34);
    }

    ctx.fillStyle=COL.accent; rr(W/2-85,H/2+58,170,50,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 17px Segoe UI';ctx.fillText('PLAY AGAIN',W/2,H/2+90);
  }

  ctx.textAlign='left';
}

// ── Collision (AABB with shrink) ───────────────────────
function hits(a,b,shrink=10){
  return(
    a.x-a.w/2+shrink < b.x+b.w/2-shrink &&
    a.x+a.w/2-shrink > b.x-b.w/2+shrink &&
    a.y-a.h/2+shrink < b.y+b.h/2-shrink &&
    a.y+a.h/2-shrink > b.y-b.h/2+shrink
  );
}

// ── Crash particles ────────────────────────────────────
function crash(x,y){
  for(let i=0;i<22;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*4;
    particles.push({
      x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
      r:2+Math.random()*5,life:1,
      color:['#ff5030','#ffcc00','#ff8030','#fff'][Math.floor(Math.random()*4)],
    });
  }
}

// ── Update ─────────────────────────────────────────────
function update(){
  if(state!=='play') return;
  frame++;

  // Natural speed target (increases over time)
  const target=Math.min(player.maxSpeed, 3+frame/900);

  const up   =keys['ArrowUp']   ||keys['w']||keys['W'];
  const down =keys['ArrowDown'] ||keys['s']||keys['S'];
  const left =keys['ArrowLeft'] ||keys['a']||keys['A'];
  const right=keys['ArrowRight']||keys['d']||keys['D'];

  // Speed
  player.braking=down;
  if(up)         player.speed=Math.min(player.maxSpeed, player.speed+player.accel);
  else if(down)  player.speed=Math.max(1.5, player.speed-player.brakeStr);
  else           player.speed+=(player.speed<target?0.025:-0.04);

  // Lateral
  if(left)  player.vx-=player.latAccel;
  if(right) player.vx+=player.latAccel;
  player.vx*=player.latFric;
  player.vx=Math.max(-player.latMax,Math.min(player.latMax,player.vx));
  player.x +=player.vx;
  player.x  =Math.max(MIN_PX,Math.min(MAX_PX,player.x));

  // Scroll offsets
  roadOff =(roadOff +player.speed    )%64;
  grassOff=(grassOff+player.speed*.45)%160;

  // Score
  score+=player.speed*.12;

  // Trees
  trees.forEach(t=>t.y+=player.speed);
  trees=trees.filter(t=>t.y<H+80);
  if(frame%55===0) spawnTree();

  // NPCs
  const spawnEvery=Math.max(55,170-frame*.07);
  if(frame%Math.floor(spawnEvery)===0) spawnNPC();
  npcs.forEach(n=>{ n.y+=Math.max(0.4, player.speed-n.speed); });
  npcs=npcs.filter(n=>n.y<H+100);

  // Collision
  for(const n of npcs){
    if(hits(player,n)){
      crash(player.x,player.y);
      state='dead';
      hiScore=Math.max(hiScore,score);
      return;
    }
  }

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.04;p.r*=0.95;});
  particles=particles.filter(p=>p.life>0);
}

// ── Render ─────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawRoad();

  // trees sorted back-to-front
  [...trees].sort((a,b)=>a.y-b.y).forEach(drawTree);

  // speed-lines when fast
  if(state==='play'&&player.speed>7){
    ctx.save();ctx.globalAlpha=(player.speed-7)/5*.18;ctx.strokeStyle='#fff';ctx.lineWidth=1;
    for(let i=0;i<8;i++){
      const lx=ROAD_X+10+Math.random()*ROAD_W;
      const len=10+Math.random()*30;
      const ly=(frame*player.speed*1.2+i*80)%H;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+len);ctx.stroke();
    }
    ctx.restore();
  }

  // NPCs
  npcs.forEach(n=>drawCar(n.x,n.y,n.w,n.h,n.color,false,false));

  // Player
  drawCar(player.x,player.y,player.w,player.h,player.color,true,player.braking);

  // Particles
  drawParticles();

  // Vignette
  const vg=ctx.createRadialGradient(W/2,H*.55,H*.22,W/2,H*.55,H*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  if(state==='play') drawHUD();
  else drawOverlay();
}

// ── Loop ───────────────────────────────────────────────
function loop(){update();render();requestAnimationFrame(loop);}

state='start';trees=[];npcs=[];particles=[];
// pre-draw road scene for start screen
for(let y=H+60;y>-100;y-=90) spawnTree(y);

loop();
</script>
</body>
</html>
